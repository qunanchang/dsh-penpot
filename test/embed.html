<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>Penpot embed test</title></head>
<body style="margin:0;background:#0b0b0c">
  <!-- 把 team-id / file-id / page-id 换成你自己的；端口与 proxyPort 一致 -->
  <iframe
    src="http://127.0.0.1:9002/#/workspace?team-id=<team-id>&file-id=<file-id>&page-id=<page-id>"
    style="width:100%;height:100vh;border:0;display:block"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>
</body></html>
