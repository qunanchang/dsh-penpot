name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/transit.js
      - name: offline self-checks (fake ctx / fake React)
        run: |
          node test/client-harness.mjs
          node test/export-ui.mjs
          node test/mcp-ui.mjs
